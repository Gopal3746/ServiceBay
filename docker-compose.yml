services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: servicebay
      POSTGRES_PASSWORD: servicebay
      POSTGRES_DB: servicebay
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U servicebay -d servicebay"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
